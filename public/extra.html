<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extra - Panificadora ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--accent:#16a34a;--border:#e2e8f0;--header:#1e293b}
*{box-sizing:border-box;font-family:'Quicksand',sans-serif}
body{background:var(--bg);margin:0;font-size:14px;color:var(--text)}
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--header);color:#fff;display:flex;align-items:center;padding:0 12px;gap:8px}
.topbar button{background:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
.wrap{margin-top:60px;padding:12px;max-width:1100px}
.tabs button{background:#fff;border:1px solid var(--border);padding:8px 10px;border-radius:8px;font-weight:700;margin:2px;cursor:pointer}
.tabs button:hover{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
input,select{padding:8px;margin:2px;border:1px solid var(--border);border-radius:6px}
.btn{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;padding:8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px;text-transform:uppercase}
table.data td{padding:8px;border-bottom:1px solid var(--border)}
.preview{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px;white-space:pre-wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.ok{background:#dcfce7;color:#15803d}.warn{background:#fef3c7;color:#92400e}.danger{background:#fee2e2;color:#dc2626}
@media print{.topbar,.tabs,.noprint{display:none!important}#printCont{display:block!important}}
#printCont{display:none}
</style>
</head>
<body>
<div class="topbar">
  <button onclick="location.href='/admin'">← Dashboard</button><div>Extra</div>
  <div style="margin-left:auto">
    <a href="https://outlook.live.com/mail/" target="_blank" style="background:#0078d4;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Outlook</a>
    <a href="https://www.office.com/launch/word" target="_blank" style="background:#2b579a;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Word</a>
    <a href="https://www.office.com/launch/excel" target="_blank" style="background:#217346;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Excel</a>
  </div>
</div>
<div class="wrap">
  <div class="tabs">
    <button onclick="aba('bancos')">Bancos</button>
    <button onclick="aba('nf')">NF</button>
    <button onclick="aba('dre')">DRE</button>
    <button onclick="aba('agenda')">Agenda</button>
    <button onclick="aba('arq')">Arquivos</button>
    <button onclick="aba('ponto')">Ponto</button>
    <button onclick="aba('bot')">Bot Celular</button>
    <button onclick="aba('integ')">Integrações</button>
    <button onclick="aba('comparar')">Comparar</button>
    <button onclick="aba('audit')">Auditoria</button>
    <button onclick="aba('fat')">Faturamento</button>
    <button onclick="aba('cont')">Contratos</button>
    <button onclick="aba('rel')">Relatórios</button>
    <button onclick="aba('prod')">Produção</button>
  </div>
  <div id="tela" class="card">...</div>
  <div id="printCont"></div>
</div>
<script>
const B = location.origin;
async function GET(p){ const r = await fetch(B+p); return await r.json(); }
async function POST(p,d){ const r = await fetch(B+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}); return await r.json(); }
function fmt(v){ return 'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }
function aba(t){
  try{ location.hash=t; }catch(e){}
  if(t=='bancos') telaBancos();
  if(t=='nf') telaNF();
  if(t=='dre') telaDRE();
  if(t=='agenda') telaAgenda();
  if(t=='arq') telaArq();
  if(t=='ponto') telaPonto();
  if(t=='bot') telaBot();
  if(t=='integ') telaInteg();
  if(t=='comparar') telaComparar();
  if(t=='audit') telaAudit();
  if(t=='fat') telaFat();
  if(t=='cont') telaCont();
  if(t=='rel') telaRel();
  if(t=='prod') telaProd();
}
function tabela(heads,rows){
  if(!rows||!rows.length) return '<p style="color:#64748b">Nenhum registro</p>';
  let h='<table class="data"><thead><tr>';
  heads.forEach(x=>h+='<th>'+x+'</th>');
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr>';r.forEach(c=>h+='<td>'+c+'</td>');h+='</tr>';});
  h+='</tbody></table>';return h;
}
function pegaData(o){ return o.data||o.created_at||o.inicio||o.vencimento||null; }
function filtra(l,per){
  if(!l) return [];
  if(per=='todos') return l;
  let hoje=new Date();hoje.setHours(0,0,0,0);
  return l.filter(o=>{
    let d=new Date(pegaData(o));
    if(isNaN(d)) return true;
    if(per=='hoje') return d>=hoje;
    if(per=='7d'){let x=new Date();x.setDate(x.getDate()-7);return d>=x;}
    if(per=='30d'){let x=new Date();x.setDate(x.getDate()-30);return d>=x;}
    if(per=='mes'){let n=new Date();return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear();}
    return true;
  });
}
async function telaBancos(){
  document.getElementById('tela').innerHTML='<h3>Bancos - Status</h3><div id="st"></div><div id="lc"></div>Banco <input id="bc"><input id="ag" placeholder="ag/conta"><button class="btn" onclick="saveBanco()">Salvar</button>';
  const c=await GET('/api/bancos/config');
  document.getElementById('st').innerHTML=tabela(['Tipo','Prov','Ativo'],(c.configs||[]).map(x=>[x.tipo,x.provedor,x.ativo?'SIM':'NAO']));
  const r=await GET('/api/bancos/vinculos');
  document.getElementById('lc').innerHTML=tabela(['Banco','Conta'],(r.contas||[]).map(x=>[x.banco,x.ag_conta]));
}
async function saveBanco(){await POST('/api/bancos/conta',{banco:document.getElementById('bc').value,ag_conta:document.getElementById('ag').value});telaBancos();}
async function telaNF(){
  document.getElementById('tela').innerHTML='<h3>NF Entrada/Saida</h3><select id="nt"><option>ENTRADA</option><option>SAIDA</option></select><input id="nn" placeholder="num"><input id="np" placeholder="pessoa"><input id="nv" type="number"><button class="btn" onclick="saveNF()">Emitir</button><div id="ln"></div>';
  const r=await GET('/api/nf_lista');
  document.getElementById('ln').innerHTML=tabela(['Tipo','Num','Total'],(r.notas||[]).map(x=>[x.tipo,x.numero,fmt(x.total)]));
}
async function saveNF(){await POST('/api/nf/criar',{tipo:nt.value,numero:nn.value,pessoa:np.value,total:nv.value,aliq_icms:18,aliq_pis:1.65,aliq_cofins:7.6,aliq_iss:5});telaNF();}
async function telaDRE(){
  document.getElementById('tela').innerHTML='<h3>DRE Gerencial</h3><div class="noprint"><button class="btn" onclick="verDRE()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir</button></div><div id="dre" class="preview">...</div>';
  verDRE();
}
async function verDRE(){
  const r=await GET('/api/dre_resumo');
  document.getElementById('dre').innerHTML='Receita '+fmt(r.receita)+'<br>Impostos '+fmt(r.impostos)+'<br>Lucro '+fmt(r.lucro);
  document.getElementById('printCont').innerHTML='<h2>DRE</h2>'+document.getElementById('dre').innerHTML;
}
async function telaAgenda(){
  document.getElementById('tela').innerHTML='<h3>Agenda</h3>Titulo<input id="et">Inicio<input id="ei" type="datetime-local">Fim<input id="ef" type="datetime-local"><button class="btn" onclick="saveEv()">Salvar</button><div id="la"></div>';
  const r=await GET('/api/agenda_lista');
  document.getElementById('la').innerHTML=tabela(['Titulo','Inicio'],(r.eventos||[]).map(x=>[x.titulo,x.inicio]));
}
async function saveEv(){await POST('/api/agenda/criar',{titulo:et.value,inicio:ei.value,fim:ef.value});telaAgenda();}
async function telaArq(){
  document.getElementById('tela').innerHTML='<h3>Arquivos - upload</h3><input id="af" type="file"><button class="btn" onclick="saveAr()">Fazer Upload</button><div id="l"></div>';
  const r=await GET('/api/arquivos_lista');
  document.getElementById('l').innerHTML=tabela(['Nome','Cat'],(r.arquivos||[]).map(a=>['<a href="'+a.url+'" target="_blank">'+a.nome+'</a>',a.categoria||'']));
}
async function saveAr(){const f=document.getElementById('af').files[0];if(!f){alert('escolhe');return;}const fd=new FormData();fd.append('file',f);fd.append('categoria','GERAL');fd.append('referencia','');await fetch(B+'/api/arquivos/upload',{method:'POST',body:fd});telaArq();}
async function telaPonto(){
  document.getElementById('tela').innerHTML='<h3>Ponto - Registro + Ajuste + Atestado</h3><div id="lp"></div>'
  +'<div class="preview">Mat<input id="pm" size="8"> Data<input id="pd" type="date"> Ent<input id="pe" type="time" value="08:00"> Sai<input id="ps" type="time" value="17:00"><button class="btn" onclick="savePt()">Registrar</button></div>'
  +'<div class="preview">Ajuste Mat<input id="jm" size="8"> Campo<select id="jc"><option>entrada</option><option>saida</option><option>horas_trabalhadas</option><option>horas_extras</option></select> Novo<input id="jn" size="6"> Motivo<input id="jmo" size="10"><button class="btn" onclick="saveAjust()">Pedir Ajuste</button></div>'
  +'<div class="preview">Atestado Mat<input id="am" size="6"> Data<input id="ad" type="date"> Dias<input id="adi" size="3" value="1"><button class="btn" onclick="saveAt()">Salvar Atestado</button></div>';
  const r=await GET('/api/rh/ponto_calc');
  document.getElementById('lp').innerHTML='<b>Pontos</b>'+tabela(['Data','Mat'],(r.ponto||[]).slice(0,10).map(x=>[x.data,x.funcionario_matricula]))
  +'<b>Ajustes</b>'+tabela(['Mat','Campo'],(r.ajustes||[]).map(x=>[x.funcionario_matricula,x.campo]))
  +'<b>Atestados</b>'+tabela(['Mat','Dias'],(r.atestados||[]).map(x=>[x.funcionario_matricula,x.dias]));
}
async function savePt(){await POST('/api/rh/ponto/registrar2',{funcionario_matricula:document.getElementById('pm').value,data:document.getElementById('pd').value,entrada:document.getElementById('pe').value,saida:document.getElementById('ps').value});telaPonto();}
async function saveAjust(){await POST('/api/rh/ponto/ajustar',{funcionario_matricula:document.getElementById('jm').value,campo:document.getElementById('jc').value,valor_novo:document.getElementById('jn').value,motivo:document.getElementById('jmo').value});alert('pedido');telaPonto();}
async function saveAt(){await POST('/api/rh/atestados/criar',{funcionario_matricula:document.getElementById('am').value,data:document.getElementById('ad').value,dias:document.getElementById('adi').value});telaPonto();}
async function telaBot(){document.getElementById('tela').innerHTML='<h3>Bot Celular - por ultimo</h3><div class="preview">Espaco chave Evolution. Nao mexer agora.</div><input id="bmsg" placeholder="oi"><button class="btn" onclick="testBot()">Testar</button><div id="bchat" class="preview"></div>';}
async function testBot(){const r=await POST('/api/bot/responder',{mensagem:document.getElementById('bmsg').value});document.getElementById('bchat').innerHTML=r.resposta||JSON.stringify(r);}
async function telaInteg(){
  document.getElementById('tela').innerHTML='<h3>Integracoes TRIO</h3><div class="noprint">Tipo<select id="it"><option>BANCO</option><option>IFOOD</option><option>NF</option><option>BOLETO</option><option>BOT</option></select>Prov<input id="ip">Key<input id="ik" size="18"><button class="btn" onclick="saveIn()">Salvar</button></div><div id="c"></div>';
  const r=await GET('/api/bancos/config');
  document.getElementById('c').innerHTML=tabela(['Tipo','Prov','Ativo'],(r.configs||[]).map(x=>[x.tipo,x.provedor,x.ativo?'SIM':'NAO']));
}
async function saveIn(){await POST('/api/bancos/config',{tipo:it.value,provedor:ip.value,api_key:ik.value});telaInteg();}
async function telaComparar(){
  document.getElementById('tela').innerHTML='<h3>Comparar Loja x iFood x Site</h3><div id="cmp">...</div>';
  const v=await GET('/api/vendas');const s=await GET('/api/site/pedidos');
  let l=(v.vendas||[]).reduce((a,x)=>a+parseFloat(x.total||0),0);let si=0,ifo=0;
  (s.pedidos||[]).forEach(p=>{if(p.forma_pagamento=='IFOOD')ifo+=parseFloat(p.total||0);else si+=parseFloat(p.total||0);});
  document.getElementById('cmp').innerHTML=tabela(['Canal','Total'],[['Loja',fmt(l)],['iFood',fmt(ifo)],['Site',fmt(si)]]);
}
async function telaAudit(){
  document.getElementById('tela').innerHTML='<h3>Auditoria - escolhe o que auditar</h3>'
  +'<div class="noprint"><label><input type="checkbox" id="a_prod" checked> Produto</label> <label><input type="checkbox" id="a_caixa" checked> Caixa</label> <label><input type="checkbox" id="a_ponto" checked> Ponto</label> <label><input type="checkbox" id="a_sal" checked> Salarios</label> <label><input type="checkbox" id="a_tes" checked> Tesouraria</label> <label><input type="checkbox" id="a_ped" checked> Pedidos</label><br>Periodo <select id="aper"><option value="todos">Todos</option><option value="hoje">Hoje</option><option value="7d">7 dias</option><option value="30d">30 dias</option></select> <button class="btn" onclick="verAudit()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir</button></div>'
  +'<div id="aout" class="preview">Marca e clica...</div><div id="acomp"></div>';
  window._aprov={};
}
async function verAudit(){
  let per=document.getElementById('aper').value;let mods=[];
  if(document.getElementById('a_prod').checked)mods.push('produto');
  if(document.getElementById('a_caixa').checked)mods.push('caixa');
  if(document.getElementById('a_ponto').checked)mods.push('ponto');
  if(document.getElementById('a_sal').checked)mods.push('salarios');
  if(document.getElementById('a_tes').checked)mods.push('tesouraria');
  if(document.getElementById('a_ped').checked)mods.push('pedido');
  let v=await GET('/api/vendas');let p=await GET('/api/produtos');
  let h='<table class="data"><tr><th>Modulo</th><th>Item</th><th>Valor</th><th>Status</th><th>Acao</th></tr>';
  function linha(id,mod,desc,val){
    let st=window._aprov[mod+id]||'PENDENTE';
    let cl=st=='APROVADO'?'ok':st=='REPROVADO'?'danger':'warn';
    return '<tr><td>'+mod+'</td><td>'+desc+'</td><td>'+val+'</td><td><span class="badge '+cl+'">'+st+'</span></td><td class="noprint"><button class="btn" onclick="auditDec(\''+mod+'\',\''+id+'\',\'APROVADO\')">Aprova</button> <button class="btn" onclick="auditDec(\''+mod+'\',\''+id+'\',\'REPROVADO\')">Reprova</button></td></tr>';
  }
  if(mods.includes('caixa')){filtra(v.vendas||[],per).slice(0,15).forEach(x=>{h+=linha(x.id,'caixa','#'+x.id,fmt(x.total));});}
  if(mods.includes('produto')){filtra(p.produtos||[],per).slice(0,15).forEach(x=>{h+=linha(x.id,'produto',x.nome,fmt(x.preco_venda));});}
  h+='</table>';
  document.getElementById('aout').innerHTML=h;
  document.getElementById('acomp').innerHTML='<div class="preview">Comparativo embaixo para gerente conferir</div>';
  document.getElementById('printCont').innerHTML='<h2>Auditoria</h2>'+h;
}
function auditDec(mod,id,st){window._aprov[mod+id]=st;verAudit();}
async function telaFat(){
  document.getElementById('tela').innerHTML='<h3>Faturamento</h3><div class="noprint"><button class="btn" onclick="verFatPrev()">Ver Preview</button></div><div id="ff" class="preview">...</div>';
  verFatPrev();
}
async function verFatPrev(){
  const c=await GET('/api/contas');
  let g={};
  (c.contas||[]).forEach(x=>{if(x.status!='ABERTO')return;let k=x.pessoa+'|'+x.tipo;if(!g[k])g[k]={pessoa:x.pessoa,tipo:x.tipo,total:0};g[k].total+=parseFloat(x.valor||0);});
  document.getElementById('ff').innerHTML=tabela(['Cliente','Tipo','Total'],Object.values(g).map(x=>[x.pessoa,x.tipo,fmt(x.total)]));
}
async function telaCont(){
  document.getElementById('tela').innerHTML='<h3>Contratos</h3><div class="noprint"><label><input type="checkbox" id="t1" checked> Servicos</label><label><input type="checkbox" id="t2"> Producao</label><label><input type="checkbox" id="t3"> Compra</label><label><input type="checkbox" id="t4"> Armazenagem</label><label><input type="checkbox" id="t5"> Locacao</label><br>Cliente<input id="cc">Valor<input id="cv" type="number">Prazo<input id="cp" type="date">Detalhe<input id="co"> <button class="btn" onclick="saveC()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir</button></div><div id="pct" class="preview">Preview...</div><div id="lc"></div>';
  const r=await GET('/api/contratos_lista');
  document.getElementById('lc').innerHTML=tabela(['ID','Cliente'],(r.contratos||[]).map(x=>[x.id,x.cliente]));
}
async function saveC(){
  let t=[];
  if(document.getElementById('t1').checked)t.push('PRESTACAO_SERVICOS');
  if(document.getElementById('t2').checked)t.push('PRODUCAO_FORNECIMENTO');
  if(document.getElementById('t3').checked)t.push('COMPRA_VENDA');
  if(document.getElementById('t4').checked)t.push('ARMAZENAGEM');
  if(document.getElementById('t5').checked)t.push('LOCACAO_ESPACO');
  const r=await POST('/api/contratos/criar',{cliente:cc.value,valor:cv.value,prazo:cp.value,objeto:co.value,tipos:t});
  document.getElementById('pct').innerHTML=r.texto||JSON.stringify(r);
  document.getElementById('printCont').innerHTML='<h2>CONTRATO</h2><p>'+(r.texto||'').replace(/\n/g,'<br>')+'</p>';
}
async function telaRel(){
  document.getElementById('tela').innerHTML='<h3>Relatorios Gerenciais</h3><div class="noprint">Tipo <select id="rtipo"><option value="vendas">Vendas</option><option value="financeiro">Financeiro</option></select> Periodo <select id="rper"><option value="todos">Todos</option><option value="hoje">Hoje</option><option value="7d">7 dias</option></select> <button class="btn" onclick="verRel()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir</button></div><div id="rprev" class="preview">...</div>';
}
async function verRel(){
  let t=document.getElementById('rtipo').value;let per=document.getElementById('rper').value;
  if(t=='vendas'){const v=await GET('/api/vendas');let l=filtra(v.vendas||[],per);document.getElementById('rprev').innerHTML=tabela(['ID','Total'],l.map(x=>[x.id,fmt(x.total)]));}
  else{const c=await GET('/api/contas');let l=filtra(c.contas||[],per);document.getElementById('rprev').innerHTML=tabela(['Pessoa','Valor'],l.map(x=>[x.pessoa,fmt(x.valor)]));}
}
async function telaProd(){
  document.getElementById('tela').innerHTML='<h3>Produção - acompanhamento</h3><label><input type="checkbox" id="prodAdm" checked onchange="verProd()"> ADM completo</label> Minha mat<input id="pminhamat" size="8"><button class="btn" onclick="verProd()">Ver</button><div class="preview">Novo: Produto<input id="ppnome" size="10"> Qtd<input id="ppqtd" type="number" size="4"> Resp<input id="ppresp" size="8"> Mat<input id="ppmat" size="6"> Fim<input id="ppfim" type="datetime-local"> Custo<input id="ppcusto" type="number" size="5"> Preco<input id="pppreco" type="number" size="5"><button class="btn" onclick="iniciaProd()">Iniciar</button></div><div id="pplist"></div>';
  verProd();
}
async function verProd(){
  const r=await GET('/api/producao/acompanhamento');
  let orders=r.ordens||[];
  let adm=document.getElementById('prodAdm').checked;
  let minha=document.getElementById('pminhamat').value;
  if(!adm&&minha) orders=orders.filter(o=>o.responsavel_matricula==minha);
  let h='<table class="data"><tr><th>Produzindo</th><th>Pronta/Meta</th><th>Quem</th><th>Horario</th><th>Gastou</th><th>Termina</th><th>Lucro est</th><th></th></tr>';
  orders.forEach(o=>{
    let lucro=parseFloat(o.qtd_meta||0)*parseFloat(o.preco_un||0)-parseFloat(o.custo_insumos||0);
    if(!adm){h+='<tr><td>'+o.produto_nome+'</td><td>'+o.qtd_pronta+'/'+o.qtd_meta+'</td><td>'+o.responsavel_nome+'</td><td>'+(o.inicio||'').slice(0,16)+'</td><td>-</td><td>-</td><td>-</td><td><button class="btn" onclick="atualizaProd('+o.id+')">Atualizar</button></td></tr>';}
    else{h+='<tr><td>'+o.produto_nome+'</td><td>'+o.qtd_pronta+'/'+o.qtd_meta+'</td><td>'+o.responsavel_nome+'</td><td>'+(o.inicio||'').slice(0,16)+'</td><td>'+fmt(o.custo_insumos)+'</td><td>'+(o.previsao_fim||'').slice(0,16)+'</td><td>'+fmt(lucro)+'</td><td><button class="btn" onclick="atualizaProd('+o.id+')">+Qtd</button> <button class="btn" onclick="concluiProd('+o.id+')">Concluir</button></td></tr>';}
  });
  h+='</table>';document.getElementById('pplist').innerHTML=h;
}
async function iniciaProd(){await POST('/api/producao/iniciar',{produto_nome:ppnome.value,qtd_meta:ppqtd.value,responsavel_nome:ppresp.value,responsavel_matricula:ppmat.value,previsao_fim:ppfim.value,custo_insumos:ppcusto.value,preco_un:pppreco.value});telaProd();}
async function atualizaProd(id){let q=prompt('Qtd pronta?');await POST('/api/producao/atualizar',{id:id,qtd_pronta:q});verProd();}
async function concluiProd(id){if(!confirm('Concluir?'))return;await POST('/api/producao/concluir',{id:id});verProd();}
let h=location.hash.replace('#','');if(h)aba(h);else telaBancos();
</script>
</body>
</html>
