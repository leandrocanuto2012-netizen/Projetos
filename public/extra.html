<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extra - Panificadora ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--accent:#16a34a;--border:#e2e8f0;--header:#1e293b}
*{box-sizing:border-box;font-family:'Quicksand',sans-serif}
body{background:var(--bg);margin:0;font-size:14px;color:var(--text)}
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--header);color:#fff;display:flex;align-items:center;padding:0 12px;gap:8px}
.topbar button{background:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
.wrap{margin-top:60px;padding:12px;max-width:1100px}
.tabs button{background:#fff;border:1px solid var(--border);padding:8px 10px;border-radius:8px;font-weight:700;margin:2px;cursor:pointer}
.tabs button:hover{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
input,select{padding:8px;margin:2px;border:1px solid var(--border);border-radius:6px}
.btn{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;padding:8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px;text-transform:uppercase}
table.data td{padding:8px;border-bottom:1px solid var(--border)}
.preview{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px;white-space:pre-wrap}
@media print{.topbar,.tabs,.noprint{display:none!important}#printCont{display:block!important}}
#printCont{display:none}
</style>
</head>
<body>
<div class="topbar">
<button onclick="location.href='/admin'">← Dashboard</button>
<button onclick="window.open('/','_blank')">Site</button>
<div>Extra</div>
<div style="margin-left:auto">
<a href="https://outlook.live.com/mail/" target="_blank" style="background:#0078d4;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Outlook</a>
<a href="https://www.office.com/launch/word" target="_blank" style="background:#2b579a;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Word</a>
<a href="https://www.office.com/launch/excel" target="_blank" style="background:#217346;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Excel</a>
</div>
</div>
<div class="wrap">
<div class="tabs">
<button onclick="aba('bancos')">Bancos</button>
<button onclick="aba('nf')">NF</button>
<button onclick="aba('dre')">DRE</button>
<button onclick="aba('agenda')">Agenda</button>
<button onclick="aba('arq')">Arquivos</button>
<button onclick="aba('ponto')">Ponto</button>
<button onclick="aba('bot')">Bot Celular</button>
<button onclick="aba('integ')">Integrações</button>
<button onclick="aba('comparar')">Comparar</button>
<button onclick="aba('audit')">Auditoria</button>
<button onclick="aba('fat')">Faturamento</button>
<button onclick="aba('cont')">Contratos</button>
<button onclick="aba('rel')">Relatórios</button>
<button onclick="aba('prod')">Produção</button>
<button onclick="aba('frota')">Frota</button>
</div>
<div id="tela" class="card">...</div>
<div id="printCont"></div>
</div>
<script>
const B = location.origin;
async function GET(p){const r=await fetch(B+p);return await r.json();}
async function POST(p,d){const r=await fetch(B+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return await r.json();}
function fmt(v){return 'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});}
function aba(t){
 try{location.hash=t;}catch(e){}
 if(t=='bancos')telaBancos();
 if(t=='nf')telaNF();
 if(t=='dre')telaDRE();
 if(t=='agenda')telaAgenda();
 if(t=='arq')telaArq();
 if(t=='ponto')telaPonto();
 if(t=='bot')telaBot();
 if(t=='integ')telaInteg();
 if(t=='comparar')telaComparar();
 if(t=='audit')telaAudit();
 if(t=='fat')telaFat();
 if(t=='cont')telaCont();
 if(t=='rel')telaRel();
 if(t=='prod')telaProd();
 if(t=='frota')telaFrota();
}
function tabela(h,r){if(!r||!r.length)return '<p style="color:#64748b">Nenhum registro</p>';let s='<table class="data"><thead><tr>';h.forEach(x=>s+='<th>'+x+'</th>');s+='</tr></thead><tbody>';r.forEach(row=>{s+='<tr>';row.forEach(c=>s+='<td>'+c+'</td>');s+='</tr>';});s+='</tbody></table>';return s;}
function pegaData(o){return o.data||o.created_at||o.inicio||o.vencimento||null;}
function filtra(l,per){if(!l)return[];if(per=='todos')return l;let h=new Date();h.setHours(0,0,0,0);return l.filter(o=>{let raw=pegaData(o);if(!raw)return false;let d=new Date(raw);if(isNaN(d))return false;if(per=='hoje')return d>=h;if(per=='7d'){let x=new Date();x.setDate(x.getDate()-7);return d>=x;}if(per=='30d'){let x=new Date();x.setDate(x.getDate()-30);return d>=x;}if(per=='mes'){let n=new Date();return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear();}return true;});}
async function telaBancos(){document.getElementById('tela').innerHTML='<h3>Bancos</h3><div id="lc"></div>Banco<input id="bc"><input id="ag"><button class="btn" onclick="saveBanco()">Salvar</button>';const r=await GET('/api/bancos/vinculos');document.getElementById('lc').innerHTML=tabela(['Banco'],(r.contas||[]).map(x=>[x.banco]));}
async function saveBanco(){await POST('/api/bancos/conta',{banco:document.getElementById('bc').value,ag_conta:document.getElementById('ag').value});telaBancos();}
async function telaNF(){document.getElementById('tela').innerHTML='<h3>NF</h3><select id="nt"><option>ENTRADA</option><option>SAIDA</option></select><input id="nn"><input id="nv" type="number"><button class="btn" onclick="saveNF()">Emitir</button><div id="ln"></div>';const r=await GET('/api/nf_lista');document.getElementById('ln').innerHTML=tabela(['Tipo','Num'],(r.notas||[]).map(x=>[x.tipo,x.numero]));}
async function saveNF(){await POST('/api/nf/criar',{tipo:document.getElementById('nt').value,numero:document.getElementById('nn').value,total:document.getElementById('nv').value});telaNF();}
async function telaDRE(){document.getElementById('tela').innerHTML='<h3>DRE</h3><div id="dre"></div>';const r=await GET('/api/dre_resumo');document.getElementById('dre').innerHTML='Receita '+fmt(r.receita)+' Lucro '+fmt(r.lucro);}
async function telaAgenda(){document.getElementById('tela').innerHTML='<h3>Agenda</h3><input id="et"><input id="ei" type="datetime-local"><button class="btn" onclick="saveEv()">Salvar</button><div id="la"></div>';const r=await GET('/api/agenda_lista');document.getElementById('la').innerHTML=tabela(['Tit'],(r.eventos||[]).map(x=>[x.titulo]));}
async function saveEv(){await POST('/api/agenda/criar',{titulo:document.getElementById('et').value,inicio:document.getElementById('ei').value});telaAgenda();}
async function telaArq(){document.getElementById('tela').innerHTML='<h3>Arquivos</h3><input id="af" type="file"><button class="btn" onclick="saveAr()">Upload</button>';}
async function saveAr(){const f=document.getElementById('af').files[0];const fd=new FormData();fd.append('file',f);await fetch(B+'/api/arquivos/upload',{method:'POST',body:fd});telaArq();}
async function telaPonto(){document.getElementById('tela').innerHTML='<h3>Ponto</h3><div id="lp"></div>Mat<input id="pm" size="8">Data<input id="pd" type="date"><button class="btn" onclick="savePt()">Registrar</button>';const r=await GET('/api/rh/ponto_calc');document.getElementById('lp').innerHTML=tabela(['Data','Mat'],(r.ponto||[]).map(x=>[x.data,x.funcionario_matricula]));}
async function savePt(){await POST('/api/rh/ponto/registrar2',{funcionario_matricula:document.getElementById('pm').value,data:document.getElementById('pd').value});telaPonto();}
async function telaBot(){document.getElementById('tela').innerHTML='<h3>Bot Celular - por ultimo</h3><input id="bmsg" placeholder="oi, preço, horário"><button class="btn" onclick="testBot()">Testar</button><div id="bchat" class="preview"></div>';}
async function testBot(){const m=document.getElementById('bmsg').value;document.getElementById('bchat').innerHTML+='<br>Voce:'+m;const r=await POST('/api/bot/responder',{mensagem:m});document.getElementById('bchat').innerHTML+='<br>Bot:'+(r.resposta||'');}
async function telaInteg(){document.getElementById('tela').innerHTML='<h3>Integracoes</h3>';const r=await GET('/api/bancos/config');document.getElementById('tela').innerHTML+=tabela(['Tipo'],(r.configs||[]).map(x=>[x.tipo]));}
async function telaComparar(){document.getElementById('tela').innerHTML='<h3>Comparar Loja x iFood x Site</h3><div id="cmp"></div>';const v=await GET('/api/vendas');const s=await GET('/api/site/pedidos');let l=(v.vendas||[]).reduce((a,x)=>a+parseFloat(x.total||0),0);document.getElementById('cmp').innerHTML=tabela(['Canal','Total'],[['Loja',fmt(l)],['Site',fmt((s.pedidos||[]).reduce((a,x)=>a+parseFloat(x.total||0),0))]]);}
async function telaAudit(){document.getElementById('tela').innerHTML='<h3>Auditoria</h3>';const r=await GET('/api/auditoria_resumo');document.getElementById('tela').innerHTML+='<br>Vendas '+(r.vendas||[]).length;}
async function telaFat(){document.getElementById('tela').innerHTML='<h3>Faturamento</h3><div id="ff"></div>';const c=await GET('/api/contas');document.getElementById('ff').innerHTML=tabela(['Pessoa'],(c.contas||[]).map(x=>[x.pessoa]));}
async function telaCont(){document.getElementById('tela').innerHTML='<h3>Contratos</h3>Cliente<input id="cc">Valor<input id="cv" type="number"><button class="btn" onclick="saveC()">Salvar</button><div id="pct"></div>';}
async function saveC(){const r=await POST('/api/contratos/criar',{cliente:document.getElementById('cc').value,valor:document.getElementById('cv').value,tipos:['PRESTACAO_SERVICOS']});document.getElementById('pct').innerHTML=r.texto||JSON.stringify(r);}
async function telaRel(){document.getElementById('tela').innerHTML='<h3>Relatorios</h3>';const v=await GET('/api/vendas');document.getElementById('tela').innerHTML+=tabela(['ID'],(v.vendas||[]).map(x=>[x.id]));}
async function telaProd(){
 document.getElementById('tela').innerHTML='<h3>Produção - acompanhamento</h3><label><input type="checkbox" id="prodAdm" checked onchange="verProd()"> ADM completo</label> Minha mat<input id="pminhamat" size="8"><button class="btn" onclick="verProd()">Ver</button><div class="preview">Novo: Produto<input id="ppnome" size="10"> Qtd<input id="ppqtd" type="number" size="4"> Resp<input id="ppresp" size="8"> Mat<input id="ppmat" size="6"> Fim<input id="ppfim" type="datetime-local"> Custo<input id="ppcusto" type="number" size="5"> Preco<input id="pppreco" type="number" size="5"><button class="btn" onclick="iniciaProd()">Iniciar</button></div><div id="pplist"></div>';
 verProd();
}
async function verProd(){
 const r=await GET('/api/producao/acompanhamento');
 let orders=r.ordens||[];
 let admEl=document.getElementById('prodAdm');
 let adm=admEl?admEl.checked:true;
 let minhaEl=document.getElementById('pminhamat');
 let minha=minhaEl?minhaEl.value:'';
 if(!adm&&minha)orders=orders.filter(o=>o.responsavel_matricula==minha);
 let h='<table class="data"><tr><th>Produzindo</th><th>Pronta/Meta</th><th>Quem produziu</th><th>Horario</th><th>Gastou</th><th>Termina</th><th>Lucro est</th><th></th></tr>';
 orders.forEach(o=>{
  let lucro=parseFloat(o.qtd_meta||0)*parseFloat(o.preco_un||0)-parseFloat(o.custo_insumos||0);
  if(!adm){h+='<tr><td>'+o.produto_nome+'</td><td>'+o.qtd_pronta+'/'+o.qtd_meta+'</td><td>'+o.responsavel_nome+'</td><td>'+(o.inicio||'').slice(0,16)+'</td><td>-</td><td>-</td><td>-</td><td><button class="btn" onclick="atualizaProd('+o.id+')">Atualizar</button></td></tr>';}
  else{h+='<tr><td>'+o.produto_nome+'</td><td>'+o.qtd_pronta+'/'+o.qtd_meta+'</td><td>'+o.responsavel_nome+'</td><td>'+(o.inicio||'').slice(0,16)+'</td><td>'+fmt(o.custo_insumos)+'</td><td>'+(o.previsao_fim||'').slice(0,16)+'</td><td>'+fmt(lucro)+'</td><td><button class="btn" onclick="atualizaProd('+o.id+')">+Qtd</button></td></tr>';}
 });
 h+='</table>';
 document.getElementById('pplist').innerHTML=h;
}
async function iniciaProd(){await POST('/api/producao/iniciar',{produto_nome:document.getElementById('ppnome').value,qtd_meta:document.getElementById('ppqtd').value,responsavel_nome:document.getElementById('ppresp').value,responsavel_matricula:document.getElementById('ppmat').value,previsao_fim:document.getElementById('ppfim').value,custo_insumos:document.getElementById('ppcusto').value,preco_un:document.getElementById('pppreco').value});telaProd();}
async function atualizaProd(id){let q=prompt('Qtd pronta?');if(!q)return;await POST('/api/producao/atualizar',{id:id,qtd_pronta:q});verProd();}
async function concluiProd(id){await POST('/api/producao/concluir',{id:id});verProd();}
async function telaFrota(){document.getElementById('tela').innerHTML='<h3>Frota</h3><div id="fl"></div>Placa<input id="fplaca" size="8"><button class="btn" onclick="saveFrota()">Salvar</button>';const r=await GET('/api/frota_lista');document.getElementById('fl').innerHTML=tabela(['Placa'],(r.veiculos||[]).map(x=>[x.placa]));}
async function saveFrota(){await POST('/api/frota/veiculo/criar',{placa:document.getElementById('fplaca').value});telaFrota();}
let h=location.hash.replace('#','');if(h)aba(h);else telaProd();
</script>
</body>
</html>
