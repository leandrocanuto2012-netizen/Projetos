<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extra - Panificadora ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--accent:#16a34a;--accent-dark:#15803d;--accent-soft:#dcfce7;--border:#e2e8f0;--header:#1e293b}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Quicksand',sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px}
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--header);display:flex;align-items:center;padding:0 16px;gap:10px;color:#fff;font-weight:700}
.topbar button{background:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
.wrap{margin-top:60px;padding:16px;max-width:1000px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button{background:#fff;border:1px solid var(--border);padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.tabs button.ativo,.tabs button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px}
h2{font-size:20px}h3{font-size:16px;margin-bottom:10px}
input,select{padding:9px 12px;border:1px solid var(--border);border-radius:7px;margin:3px;font-size:13px}
.btn{background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:7px;font-weight:700;cursor:pointer;margin:3px}
.btn2{background:#fff;border:1px solid var(--border);padding:8px 12px;border-radius:7px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
td,th{padding:8px;border-bottom:1px solid var(--border);text-align:left}
</style></head><body>
<div class="topbar"><button onclick="location.href='/admin'">← Dashboard</button><div>Panificadora<span style="color:#16a34a">ERP</span> - Extra</div></div>
<div class="wrap">
<div class="tabs" id="tabs">
<button onclick="aba('bancos')">Bancos</button><button onclick="aba('nf')">NF</button><button onclick="aba('dre')">DRE</button><button onclick="aba('agenda')">Agenda</button><button onclick="aba('arq')">Arquivos</button><button onclick="aba('ponto')">Ponto</button><button onclick="aba('bot')">Bot Celular</button><button onclick="aba('integ')">Integrações</button>
</div>
<div id="tela" class="card">...</div>
</div>
<script>
const B=location.origin;
async function GET(p){return await fetch(B+p).then(r=>r.json());}
async function POST(p,d){return await fetch(B+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json());}
function aba(t){document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('ativo'));event.target.classList.add('ativo');location.hash=t;if(t=='bancos')telaBancos();if(t=='nf')telaNF();if(t=='dre')telaDRE();if(t=='agenda')telaAgenda();if(t=='arq')telaArq();if(t=='ponto')telaPonto();if(t=='bot')telaBot();if(t=='integ')telaInteg();}
async function telaBancos(){document.getElementById('tela').innerHTML='<h3>Vincular Bancos</h3><div id="lc">...</div>Banco <input id="bc"><input id="ag" placeholder="ag/conta"><button class="btn" onclick="saveBanco()">Salvar</button><br>Maq <select id="op"><option>Cielo</option><option>Rede</option><option>Stone</option></select><input id="tx" value="1.99" size="5"><button class="btn" onclick="saveMaq()">Salvar maq</button><br>iFood Total <input id="ift" type="number" size="6"><button class="btn" onclick="syncIf()">Puxar</button><br>Boleto <input id="blp" placeholder="cliente"><input id="blv" type="number" placeholder="valor"><input id="bld" type="date"><button class="btn" onclick="gerBl()">Gerar</button><div id="blo"></div>';const r=await GET('/api/bancos/vinculos');document.getElementById('lc').innerHTML='Contas:'+JSON.stringify(r.contas||[]).slice(0,1000);}
async function saveBanco(){await POST('/api/bancos/conta',{banco:bc.value,ag_conta:ag.value});telaBancos();}
async function saveMaq(){await POST('/api/bancos/maquininha',{operadora:op.value,taxa:tx.value});telaBancos();}
async function syncIf(){const r=await POST('/api/ifood/sync',{total:ift.value});alert('pedido '+r.pedido_id);telaBancos();}
async function gerBl(){const r=await POST('/api/boletos/gerar',{pessoa:blp.value,valor:blv.value,vencimento:bld.value});document.getElementById('blo').innerHTML=r.link+' '+r.linha_digitavel;}
async function telaNF(){document.getElementById('tela').innerHTML='<h3>NF Entrada/Saida</h3><select id="nt"><option>ENTRADA</option><option>SAIDA</option></select><input id="nn" placeholder="num" size="6"><input id="np" placeholder="pessoa"><input id="nv" type="number" placeholder="total"><br>ICMS<input id="ni" value="18" size="4">PIS<input id="npi" value="1.65" size="4">COF<input id="nc" value="7.6" size="4">ISS<input id="ns" value="5" size="4"><button class="btn" onclick="saveNF()">Emitir</button><div id="ln"></div>';const r=await GET('/api/nf_lista');document.getElementById('ln').innerHTML=JSON.stringify(r.notas||[]).slice(0,2000);}
async function saveNF(){const r=await POST('/api/nf/criar',{tipo:nt.value,numero:nn.value,pessoa:np.value,total:nv.value,aliq_icms:ni.value,aliq_pis:npi.value,aliq_cofins:nc.value,aliq_iss:ns.value});alert('imp '+r.impostos);telaNF();}
async function telaDRE(){document.getElementById('tela').innerHTML='<h3>DRE</h3><button class="btn" onclick="verDRE()">Ver DRE</button><div id="dre"></div>Fat<input id="sf" value="100000" size="7">Custo<input id="sc" value="40000" size="7"><select id="sr"><option>SIMPLES</option><option>PRESUMIDO</option><option>REAL</option></select><button class="btn" onclick="sim()">Simular</button><div id="simo"></div>';}
async function verDRE(){const r=await GET('/api/dre_resumo');document.getElementById('dre').innerHTML='Rec '+r.receita+' Imp '+r.impostos+' Lucro '+r.lucro;}
async function sim(){const r=await POST('/api/dre/simular',{faturamento:sf.value,custo:sc.value,regime:sr.value});document.getElementById('simo').innerHTML='PIS '+r.pis+' COF '+r.cofins+' ICMS '+r.icms+' ISS '+r.iss+' LUCRO '+r.lucro;}
async function telaAgenda(){document.getElementById('tela').innerHTML='<h3>Agenda</h3>Tit<input id="et">Ini<input id="ei" type="datetime-local">Fim<input id="ef" type="datetime-local"><button class="btn" onclick="saveEv()">Agendar</button><div id="la"></div>';const r=await GET('/api/agenda_lista');document.getElementById('la').innerHTML=JSON.stringify(r.eventos||[]).slice(0,2000);}
async function saveEv(){await POST('/api/agenda/criar',{titulo:et.value,inicio:ei.value,fim:ef.value});telaAgenda();}
async function telaArq(){document.getElementById('tela').innerHTML='<h3>Arquivos - upload</h3>Cat<select id="ac"><option>PRODUTO</option><option>FUNCIONARIO</option><option>REGISTRO</option></select> Ref<input id="ar"> <input id="af" type="file"><button class="btn" onclick="saveArFile()">Fazer Upload</button><div id="lar"></div><div id="lup"></div>';const r=await GET('/api/arquivos_lista');document.getElementById('lar').innerHTML=(r.arquivos||[]).map(a=>'<div><a href="'+a.url+'" target="_blank">'+a.nome+'</a> - '+a.categoria+'</div>').join('').slice(0,4000);}
async function saveArFile(){const f=document.getElementById('af').files[0];if(!f){alert('escolhe');return;}const fd=new FormData();fd.append('file',f);fd.append('categoria',ac.value);fd.append('referencia',ar.value);const r=await fetch(B+'/api/arquivos/upload',{method:'POST',body:fd}).then(r=>r.json());document.getElementById('lup').innerHTML=JSON.stringify(r);telaArq();}
async function telaPonto(){document.getElementById('tela').innerHTML='<h3>Ponto</h3><div id="lp">...</div>Mat<input id="pm" size="8">Data<input id="pd" type="date">Ent<input id="pe" type="time" value="08:00">Sai<input id="ps" type="time" value="17:00"><button class="btn" onclick="savePt()">Registrar</button><br>Atest Mat<input id="am" size="8">Data<input id="ad" type="date">Dias<input id="adi" value="1" size="3"><button class="btn" onclick="saveAt()">Atestado</button>';const r=await GET('/api/rh/ponto_calc');document.getElementById('lp').innerHTML=JSON.stringify(r).slice(0,2000);}
async function savePt(){await POST('/api/rh/ponto/registrar2',{funcionario_matricula:pm.value,data:pd.value,entrada:pe.value,saida:ps.value});telaPonto();}
async function saveAt(){await POST('/api/rh/atestados/criar',{funcionario_matricula:am.value,data:ad.value,dias:adi.value});telaPonto();}
async function telaBot(){document.getElementById('tela').innerHTML='<h3>Bot Celular - por ultimo</h3><input id="bmsg" placeholder="oi" size="20"><button class="btn" onclick="testBot()">Testar</button><div id="bchat"></div>';}
async function testBot(){const m=bmsg.value;document.getElementById('bchat').innerHTML+='<br>Voce:'+m;const r=await POST('/api/bot/responder',{mensagem:m});document.getElementById('bchat').innerHTML+='<br>Bot:'+(r.resposta||JSON.stringify(r));}
async function telaInteg(){document.getElementById('tela').innerHTML='<h3>Integracoes</h3><div id="lcfg">...</div>Tipo<select id="it"><option>BANCO</option><option>IFOOD</option><option>NF</option><option>BOLETO</option><option>BOT</option></select> Prov<input id="ip" size="15"><br>Key<input id="ik" size="30"><button class="btn" onclick="saveInteg()">Salvar chave</button>';const r=await GET('/api/bancos/config');document.getElementById('lcfg').innerHTML=JSON.stringify(r.configs||[]).slice(0,2000);}
async function saveInteg(){await POST('/api/bancos/config',{tipo:it.value,provedor:ip.value,api_key:ik.value});alert('salvo');telaInteg();}
let h=location.hash.replace('#','');if(h)aba(h);else telaBancos();
</script></body></html>
