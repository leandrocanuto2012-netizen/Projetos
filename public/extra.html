<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extra</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--accent:#16a34a;--border:#e2e8f0;--header:#1e293b}*{box-sizing:border-box;font-family:'Quicksand',sans-serif}body{background:var(--bg);margin:0;font-size:14px}.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--header);color:#fff;display:flex;align-items:center;padding:0 12px;gap:8px}.wrap{margin-top:60px;padding:12px}.tabs button{background:#fff;border:1px solid var(--border);padding:8px 12px;border-radius:8px;font-weight:700;margin:2px}.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px}input,select{padding:8px;margin:2px;border:1px solid var(--border);border-radius:6px}.btn{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;font-weight:700}</style></head><body>
<div class="topbar"><button onclick="location.href='/admin'">← Dashboard</button><div>Extra</div><div style="margin-left:auto"><a href="https://outlook.live.com/mail/" target="_blank" style="background:#0078d4;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Outlook</a> <a href="https://www.office.com/launch/word" target="_blank" style="background:#2b579a;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Word</a> <a href="https://www.office.com/launch/excel" target="_blank" style="background:#217346;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Excel</a></div></div>
<div class="wrap"><div><button onclick="aba('bancos')">Bancos</button><button onclick="aba('nf')">NF</button><button onclick="aba('dre')">DRE</button><button onclick="aba('agenda')">Agenda</button><button onclick="aba('arq')">Arquivos</button><button onclick="aba('ponto')">Ponto</button><button onclick="aba('integ')">Integrações</button><button onclick="aba('comparar')">Comparar</button><button onclick="aba('audit')">Auditoria</button><button onclick="aba('fat')">Faturamento</button><button onclick="aba('cont')">Contratos</button></div><div id="tela" class="card">...</div></div>
<script>
const B=location.origin;async function GET(p){return await fetch(B+p).then(r=>r.json());}async function POST(p,d){return await fetch(B+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json());}
function aba(t){location.hash=t;if(t=='bancos')telaBancos();if(t=='nf')telaNF();if(t=='dre')telaDRE();if(t=='agenda')telaAgenda();if(t=='arq')telaArq();if(t=='ponto')telaPonto();if(t=='integ')telaInteg();if(t=='comparar')telaComparar();if(t=='audit')telaAudit();if(t=='fat')telaFat();if(t=='cont')telaCont();}
async function telaBancos(){document.getElementById('tela').innerHTML='<h3>Bancos - status</h3><div id="st"></div>Banco<input id="bc"><input id="ag"><button class="btn" onclick="saveBanco()">Salvar</button><br>Boleto<input id="blp"><input id="blv" type="number"><input id="bld" type="date"><button class="btn" onclick="gerBl()">Gerar</button><div id="blo"></div>';const r=await GET('/api/bancos/config');document.getElementById('st').innerHTML=JSON.stringify(r.configs||[]);}
async function saveBanco(){await POST('/api/bancos/conta',{banco:bc.value,ag_conta:ag.value});telaBancos();}
async function gerBl(){const r=await POST('/api/boletos/gerar',{pessoa:blp.value,valor:blv.value,vencimento:bld.value});document.getElementById('blo').innerHTML=r.link;}
async function telaNF(){document.getElementById('tela').innerHTML='<h3>NF</h3><select id="nt"><option>ENTRADA</option><option>SAIDA</option></select><input id="nn"><input id="np"><input id="nv" type="number"><button class="btn" onclick="saveNF()">Emitir</button>';}
async function saveNF(){const r=await POST('/api/nf/criar',{tipo:nt.value,numero:nn.value,pessoa:np.value,total:nv.value});alert(r.impostos);telaNF();}
async function telaDRE(){document.getElementById('tela').innerHTML='<h3>DRE</h3><button class="btn" onclick="verDRE()">Ver</button><div id="dre"></div>';}
async function verDRE(){const r=await GET('/api/dre_resumo');document.getElementById('dre').innerHTML=JSON.stringify(r);}
async function telaAgenda(){document.getElementById('tela').innerHTML='<h3>Agenda</h3><input id="et"><input id="ei" type="datetime-local"><button class="btn" onclick="saveEv()">Salvar</button>';}
async function saveEv(){await POST('/api/agenda/criar',{titulo:et.value,inicio:ei.value});telaAgenda();}
async function telaArq(){document.getElementById('tela').innerHTML='<h3>Arquivos upload</h3><input id="af" type="file"><button class="btn" onclick="saveAr()">Upload</button><div id="l"></div>';const r=await GET('/api/arquivos_lista');document.getElementById('l').innerHTML=JSON.stringify(r.arquivos||[]).slice(0,2000);}
async function saveAr(){const f=af.files[0];const fd=new FormData();fd.append('file',f);const r=await fetch(B+'/api/arquivos/upload',{method:'POST',body:fd}).then(r=>r.json());alert(JSON.stringify(r));telaArq();}
async function telaPonto(){document.getElementById('tela').innerHTML='<h3>Ponto</h3><div id="lp"></div>';const r=await GET('/api/rh/ponto_calc');document.getElementById('lp').innerHTML=JSON.stringify(r).slice(0,2000);}
async function telaInteg(){document.getElementById('tela').innerHTML='<h3>Integracoes TRIO API</h3>Tipo<select id="it"><option>BANCO</option><option>IFOOD</option><option>NF</option><option>BOLETO</option><option>BOT</option></select>Prov<input id="ip">Key<input id="ik"><button class="btn" onclick="saveIn()">Salvar</button><div id="c"></div>';const r=await GET('/api/bancos/config');document.getElementById('c').innerHTML=JSON.stringify(r.configs||[]);}
async function saveIn(){await POST('/api/bancos/config',{tipo:it.value,provedor:ip.value,api_key:ik.value});telaInteg();}
async function telaComparar(){document.getElementById('tela').innerHTML='<h3>Comparar Loja x iFood x Site</h3><div id="cmp"></div>';const v=await GET('/api/vendas');document.getElementById('cmp').innerHTML=JSON.stringify(v).slice(0,2000);}
async function telaAudit(){document.getElementById('tela').innerHTML='<h3>Auditoria</h3><div id="a"></div>';const r=await GET('/api/auditoria_resumo');document.getElementById('a').innerHTML='Vendas:'+(r.vendas||[]).length+' Pedidos:'+(r.pedidos||[]).length;}
async function telaFat(){document.getElementById('tela').innerHTML='<h3>Faturamento</h3><div id="f"></div>';const r=await GET('/api/faturamento_resumo');document.getElementById('f').innerHTML='Total R$ '+r.total;}
async function telaCont(){document.getElementById('tela').innerHTML='<h3>Contratos juridico - marca 1 ou varios</h3><label><input type="checkbox" id="t1" checked> Servicos</label><label><input type="checkbox" id="t2"> Producao</label><label><input type="checkbox" id="t3"> CompraVenda</label><label><input type="checkbox" id="t4"> Armazenagem</label><label><input type="checkbox" id="t5"> Locacao</label><br>Cliente<input id="cc">Valor<input id="cv" type="number">Prazo<input id="cp" type="date"><br>Detalhe<input id="co" size="40"><button class="btn" onclick="saveC()">Montar</button><div id="pct"></div><hr>ID<input id="aid" size="4">CPF gov<input id="agov"><button class="btn" onclick="assC()">Assinar</button><a href="https://validar.iti.gov.br" target="_blank">Validar gov</a><div id="ah"></div>';}
async function saveC(){let t=[];if(t1.checked)t.push('PRESTACAO_SERVICOS');if(t2.checked)t.push('PRODUCAO_FORNECIMENTO');if(t3.checked)t.push('COMPRA_VENDA');if(t4.checked)t.push('ARMAZENAGEM');if(t5.checked)t.push('LOCACAO_ESPACO');const r=await POST('/api/contratos/criar',{cliente:cc.value,valor:cv.value,prazo:cp.value,objeto:co.value,tipos:t});document.getElementById('pct').innerHTML=r.texto;}
async function assC(){const r=await POST('/api/contratos/assinar',{id:aid.value,gov_cpf:agov.value});document.getElementById('ah').innerHTML=r.hash;}
let h=location.hash.replace('#','');if(h)aba(h);else telaBancos();
</script></body></html>
