<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extra</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--accent:#16a34a;--border:#e2e8f0;--header:#1e293b}*{box-sizing:border-box;font-family:'Quicksand',sans-serif}body{background:var(--bg);margin:0;font-size:14px}.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--header);color:#fff;display:flex;align-items:center;padding:0 12px;gap:8px}.wrap{margin-top:60px;padding:12px}.tabs button{background:#fff;border:1px solid var(--border);padding:8px 12px;border-radius:8px;font-weight:700;margin:2px}.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px}input,select{padding:8px;margin:2px;border:1px solid var(--border);border-radius:6px}.btn{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;font-weight:700}</style></head><body>
<div class="topbar"><button onclick="location.href='/admin'">← Dashboard</button><div>Extra</div><div style="margin-left:auto"><a href="https://outlook.live.com/mail/" target="_blank" style="background:#0078d4;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Outlook</a> <a href="https://www.office.com/launch/word" target="_blank" style="background:#2b579a;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Word</a> <a href="https://www.office.com/launch/excel" target="_blank" style="background:#217346;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Excel</a></div></div>
<div class="wrap"><div><button onclick="aba('bancos')">Bancos</button><button onclick="aba('nf')">NF</button><button onclick="aba('dre')">DRE</button><button onclick="aba('agenda')">Agenda</button><button onclick="aba('arq')">Arquivos</button><button onclick="aba('ponto')">Ponto</button><button onclick="aba('bot')">Bot Celular</button><button onclick="aba('integ')">Integrações</button><button onclick="aba('comparar')">Comparar</button><button onclick="aba('audit')">Auditoria</button><button onclick="aba('fat')">Faturamento</button><button onclick="aba('cont')">Contratos</button><button onclick="aba('rel')">Relatórios</button></div><div id="tela" class="card">...</div></div>
<script>
const B=location.origin;async function GET(p){return await fetch(B+p).then(r=>r.json());}async function POST(p,d){return await fetch(B+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json());}
function aba(t){location.hash=t;if(t=='bancos')telaBancos();if(t=='nf')telaNF();if(t=='dre')telaDRE();if(t=='agenda')telaAgenda();if(t=='arq')telaArq();if(t=='ponto')telaPonto();if(t=='bot')telaBot();if(t=='integ')telaInteg();if(t=='comparar')telaComparar();if(t=='audit')telaAudit();if(t=='fat')telaFat();if(t=='cont')telaCont();if(t=='rel')telaRel();}
async function telaBancos(){document.getElementById('tela').innerHTML='<h3>Bancos</h3><div id="lc">...</div>Banco <input id="bc"><input id="ag" placeholder="ag/conta"><button class="btn" onclick="saveBanco()">Salvar</button><br>Boleto <input id="blp"><input id="blv" type="number"><input id="bld" type="date"><button class="btn" onclick="gerBl()">Gerar</button><div id="blo"></div>';const r=await GET('/api/bancos/vinculos');document.getElementById('lc').innerHTML='Contas:'+JSON.stringify(r.contas||[]).slice(0,1500);}
async function saveBanco(){await POST('/api/bancos/conta',{banco:document.getElementById('bc').value,ag_conta:document.getElementById('ag').value});telaBancos();}
async function gerBl(){const r=await POST('/api/boletos/gerar',{pessoa:document.getElementById('blp').value,valor:document.getElementById('blv').value,vencimento:document.getElementById('bld').value});document.getElementById('blo').innerHTML=r.link;}
async function telaNF(){document.getElementById('tela').innerHTML='<h3>NF</h3><select id="nt"><option>ENTRADA</option><option>SAIDA</option></select><input id="nn" placeholder="num"><input id="np" placeholder="pessoa"><input id="nv" type="number"><button class="btn" onclick="saveNF()">Emitir</button><div id="ln"></div>';const r=await GET('/api/nf_lista');document.getElementById('ln').innerHTML=JSON.stringify(r.notas||[]).slice(0,2000);}
async function saveNF(){const r=await POST('/api/nf/criar',{tipo:nt.value,numero:nn.value,pessoa:np.value,total:nv.value});alert(r.impostos);telaNF();}
async function telaDRE(){document.getElementById('tela').innerHTML='<h3>DRE</h3><button class="btn" onclick="verDRE()">Ver</button><div id="dre"></div>';}
async function verDRE(){const r=await GET('/api/dre_resumo');document.getElementById('dre').innerHTML=JSON.stringify(r);}
async function telaAgenda(){document.getElementById('tela').innerHTML='<h3>Agenda</h3><input id="et"><input id="ei" type="datetime-local"><button class="btn" onclick="saveEv()">Salvar</button>';}
async function saveEv(){await POST('/api/agenda/criar',{titulo:et.value,inicio:ei.value});telaAgenda();}
async function telaArq(){document.getElementById('tela').innerHTML='<h3>Arquivos upload</h3><input id="af" type="file"><button class="btn" onclick="saveAr()">Upload</button><div id="l"></div>';const r=await GET('/api/arquivos_lista');document.getElementById('l').innerHTML=JSON.stringify(r.arquivos||[]).slice(0,2000);}
async function saveAr(){const f=document.getElementById('af').files[0];const fd=new FormData();fd.append('file',f);const r=await fetch(B+'/api/arquivos/upload',{method:'POST',body:fd}).then(r=>r.json());alert(JSON.stringify(r));telaArq();}
async function telaPonto(){document.getElementById('tela').innerHTML='<h3>Ponto</h3><div id="lp"></div>Mat<input id="pm" size="8">Data<input id="pd" type="date"><button class="btn" onclick="savePt()">Registrar</button><br>Atest Mat<input id="am" size="8">Dias<input id="adi" value="1" size="3"><button class="btn" onclick="saveAt()">Atestado</button>';const r=await GET('/api/rh/ponto_calc');document.getElementById('lp').innerHTML=JSON.stringify(r).slice(0,2000);}
async function savePt(){await POST('/api/rh/ponto/registrar2',{funcionario_matricula:pm.value,data:pd.value});telaPonto();}
async function saveAt(){await POST('/api/rh/atestados/criar',{funcionario_matricula:am.value,dias:adi.value,data:new Date().toISOString().slice(0,10)});telaPonto();}
async function telaBot(){document.getElementById('tela').innerHTML='<h3>Bot por ultimo</h3><input id="bmsg"><button class="btn" onclick="testBot()">Testar</button><div id="bchat"></div>';}
async function testBot(){const r=await POST('/api/bot/responder',{mensagem:bmsg.value});document.getElementById('bchat').innerHTML=r.resposta||JSON.stringify(r);}
async function telaInteg(){document.getElementById('tela').innerHTML='<h3>Integracoes TRIO</h3>Tipo<select id="it"><option>BANCO</option><option>IFOOD</option><option>NF</option><option>BOLETO</option><option>BOT</option></select>Prov<input id="ip">Key<input id="ik"><button class="btn" onclick="saveIn()">Salvar</button><div id="c"></div>';const r=await GET('/api/bancos/config');document.getElementById('c').innerHTML=JSON.stringify(r.configs||[]);}
async function saveIn(){await POST('/api/bancos/config',{tipo:it.value,provedor:ip.value,api_key:ik.value});telaInteg();}
async function telaComparar(){document.getElementById('tela').innerHTML='<h3>Comparar</h3><div id="cmp"></div>';const v=await GET('/api/vendas');document.getElementById('cmp').innerHTML=JSON.stringify(v).slice(0,2000);}
async function telaAudit(){document.getElementById('tela').innerHTML='<h3>Auditoria</h3><div id="a"></div><button class="btn" onclick="window.print()">Imprimir</button>';const r=await GET('/api/auditoria_resumo');document.getElementById('a').innerHTML='Vendas:'+(r.vendas||[]).length+' Pedidos:'+(r.pedidos||[]).length+' Produtos:'+(r.produtos||[]).length;}
async function telaFat(){document.getElementById('tela').innerHTML='<h3>Faturamento</h3><button class="btn" onclick="verFatPrev()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir</button><div id="ff">...</div><div id="fmsg"></div>';verFatPrev();}
async function verFatPrev(){const c=await GET('/api/contas');const f=await GET('/api/faturamento_resumo');let g={};(c.contas||[]).forEach(x=>{if(x.status!='ABERTO')return;let k=x.pessoa+'|'+x.tipo;if(!g[k])g[k]={pessoa:x.pessoa,tipo:x.tipo,total:0};g[k].total+=parseFloat(x.valor||0);});let h='Comp: Total R$ '+(f.total||0)+'<br><table>';Object.values(g).forEach(x=>{h+='<tr><td>'+x.pessoa+'</td><td>'+x.tipo+'</td><td>'+x.total.toFixed(2)+'</td><td>'+(x.tipo=='RECEBER' ? '<button class="btn" onclick="faturarGrupo(\''+x.pessoa+'\','+x.total+')">Faturar</button>':'')+'</td></tr>';});document.getElementById('ff').innerHTML=h+'</table>';}
async function faturarGrupo(p,t){const r=await POST('/api/boletos/gerar',{pessoa:p,valor:t,vencimento:new Date().toISOString().slice(0,10)});document.getElementById('fmsg').innerHTML=r.link;verFatPrev();}
async function telaCont(){document.getElementById('tela').innerHTML='<h3>Contratos</h3><label><input type="checkbox" id="t1" checked> Servicos</label><label><input type="checkbox" id="t2"> Producao</label><label><input type="checkbox" id="t3"> CompraVenda</label><label><input type="checkbox" id="t4"> Armazenagem</label><label><input type="checkbox" id="t5"> Locacao</label><br>Cliente<input id="cc">Valor<input id="cv" type="number">Prazo<input id="cp" type="date">Detalhe<input id="co" size="30"> <button class="btn" onclick="saveC()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir</button><div id="pct" style="background:#f8fafc;padding:8px">Preview...</div><div id="lc"></div>';const r=await GET('/api/contratos_lista');document.getElementById('lc').innerHTML=JSON.stringify(r.contratos||[]).slice(0,3000);}
async function saveC(){let t=[];if(document.getElementById('t1').checked)t.push('PRESTACAO_SERVICOS');if(document.getElementById('t2').checked)t.push('PRODUCAO_FORNECIMENTO');if(document.getElementById('t3').checked)t.push('COMPRA_VENDA');if(document.getElementById('t4').checked)t.push('ARMAZENAGEM');if(document.getElementById('t5').checked)t.push('LOCACAO_ESPACO');const r=await POST('/api/contratos/criar',{cliente:cc.value,valor:cv.value,prazo:cp.value,objeto:co.value,tipos:t});document.getElementById('pct').innerHTML=r.texto||JSON.stringify(r);}
async function telaRel(){document.getElementById('tela').innerHTML='<h3>Relatorios</h3><select id="rt"><option value="vendas">Vendas</option><option value="financeiro">Financeiro</option><option value="estoque">Estoque</option></select><button class="btn" onclick="verRel()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir</button><div id="rp"></div>';}
async function verRel(){let t=document.getElementById('rt').value;if(t=='vendas'){const v=await GET('/api/vendas');document.getElementById('rp').innerHTML=JSON.stringify(v.vendas||[]).slice(0,3000);}if(t=='financeiro'){const c=await GET('/api/contas');document.getElementById('rp').innerHTML=JSON.stringify(c.contas||[]).slice(0,3000);}if(t=='estoque'){const p=await GET('/api/produtos');document.getElementById('rp').innerHTML=JSON.stringify(p.produtos||[]).slice(0,3000);}}
let h=location.hash.replace('#','');if(h)aba(h);else telaBancos();
</script></body></html>
