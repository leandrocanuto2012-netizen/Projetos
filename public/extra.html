<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extra</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--accent:#16a34a;--border:#e2e8f0;--header:#1e293b}*{box-sizing:border-box;font-family:'Quicksand',sans-serif}body{background:var(--bg);margin:0;font-size:14px;color:var(--text)}.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--header);color:#fff;display:flex;align-items:center;padding:0 12px;gap:8px}.wrap{margin-top:60px;padding:12px;max-width:1100px}.tabs button{background:#fff;border:1px solid var(--border);padding:8px 10px;border-radius:8px;font-weight:700;margin:2px;cursor:pointer}.tabs button:hover{background:var(--accent);color:#fff}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}input,select{padding:8px;margin:2px;border:1px solid var(--border);border-radius:6px}.btn{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer}table.data{width:100%;border-collapse:collapse;font-size:13px}table.data th{text-align:left;padding:8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px;text-transform:uppercase}table.data td{padding:8px;border-bottom:1px solid var(--border)}.preview{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px;white-space:pre-wrap}@media print{.topbar,.tabs,.noprint{display:none!important}#printCont{display:block!important}}#printCont{display:none}</style></head><body>
<div class="topbar"><button onclick="location.href='/admin'">← Dashboard</button><div>Extra</div><div style="margin-left:auto"><a href="https://outlook.live.com/mail/" target="_blank" style="background:#0078d4;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Outlook</a> <a href="https://www.office.com/launch/word" target="_blank" style="background:#2b579a;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Word</a> <a href="https://www.office.com/launch/excel" target="_blank" style="background:#217346;color:#fff;padding:6px 8px;border-radius:6px;text-decoration:none">Excel</a></div></div>
<div class="wrap"><div class="tabs"><button onclick="aba('bancos')">Bancos</button><button onclick="aba('nf')">NF</button><button onclick="aba('dre')">DRE</button><button onclick="aba('agenda')">Agenda</button><button onclick="aba('arq')">Arquivos</button><button onclick="aba('ponto')">Ponto</button><button onclick="aba('bot')">Bot Celular</button><button onclick="aba('integ')">Integrações</button><button onclick="aba('comparar')">Comparar</button><button onclick="aba('audit')">Auditoria</button><button onclick="aba('fat')">Faturamento</button><button onclick="aba('cont')">Contratos</button><button onclick="aba('rel')">Relatórios</button></div><div id="tela" class="card">...</div><div id="printCont"></div></div>
<script>
const B=location.origin;
async function GET(p){const r=await fetch(B+p);return await r.json();}
async function POST(p,d){const r=await fetch(B+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return await r.json();}
function fmt(v){return 'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});}
function aba(t){try{location.hash=t;}catch(e){}if(t=='bancos')telaBancos();if(t=='nf')telaNF();if(t=='dre')telaDRE();if(t=='agenda')telaAgenda();if(t=='arq')telaArq();if(t=='ponto')telaPonto();if(t=='bot')telaBot();if(t=='integ')telaInteg();if(t=='comparar')telaComparar();if(t=='audit')telaAudit();if(t=='fat')telaFat();if(t=='cont')telaCont();if(t=='rel')telaRel();}
function tabela(h,r){if(!r||!r.length)return '<p style="color:#64748b">Nenhum registro</p>';return '<table class="data"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+r.map(x=>'<tr>'+x.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
function pegaData(o){return o.data||o.created_at||o.inicio||o.vencimento||null;}
function filtra(l,per){if(!l)return [];if(per=='todos')return l;let h=new Date();h.setHours(0,0,0,0);return l.filter(o=>{let d=new Date(pegaData(o));if(isNaN(d))return true;if(per=='hoje')return d>=h;if(per=='7d'){let x=new Date();x.setDate(x.getDate()-7);return d>=x;}if(per=='30d'){let x=new Date();x.setDate(x.getDate()-30);return d>=x;}if(per=='mes'){let n=new Date();return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear();}return true;});}
async function telaBancos(){document.getElementById('tela').innerHTML='<h3>Bancos - Status</h3><div id="st"></div><div id="lc"></div>Banco <input id="bc"><input id="ag" placeholder="ag/conta"><button class="btn" onclick="saveBanco()">Salvar</button><br>Boleto <input id="blp" placeholder="cliente"><input id="blv" type="number"><input id="bld" type="date"><button class="btn" onclick="gerBl()">Gerar</button><div id="blo"></div>';const c=await GET('/api/bancos/config');document.getElementById('st').innerHTML=tabela(['Tipo','Prov','Ativo'],(c.configs||[]).map(x=>[x.tipo,x.provedor,x.ativo?'SIM':'NÃO']));const r=await GET('/api/bancos/vinculos');document.getElementById('lc').innerHTML=tabela(['Banco','Conta'],(r.contas||[]).map(x=>[x.banco,x.ag_conta]));}
async function saveBanco(){await POST('/api/bancos/conta',{banco:document.getElementById('bc').value,ag_conta:document.getElementById('ag').value});telaBancos();}
async function gerBl(){const r=await POST('/api/boletos/gerar',{pessoa:document.getElementById('blp').value,valor:document.getElementById('blv').value,vencimento:document.getElementById('bld').value});document.getElementById('blo').innerHTML=r.link||JSON.stringify(r);}
async function telaNF(){document.getElementById('tela').innerHTML='<h3>NF Entrada/Saída</h3><select id="nt"><option>ENTRADA</option><option>SAIDA</option></select><input id="nn" placeholder="num"><input id="np" placeholder="pessoa"><input id="nv" type="number" placeholder="total"><button class="btn" onclick="saveNF()">Emitir</button><div id="ln"></div>';const r=await GET('/api/nf_lista');document.getElementById('ln').innerHTML=tabela(['Tipo','Num','Pessoa','Total'],(r.notas||[]).map(x=>[x.tipo,x.numero,x.pessoa||'',fmt(x.total)]));}
async function saveNF(){await POST('/api/nf/criar',{tipo:document.getElementById('nt').value,numero:document.getElementById('nn').value,pessoa:document.getElementById('np').value,total:document.getElementById('nv').value,aliq_icms:18,aliq_pis:1.65,aliq_cofins:7.6,aliq_iss:5});telaNF();}
async function telaDRE(){document.getElementById('tela').innerHTML='<h3>DRE Gerencial</h3><div class="noprint"><button class="btn" onclick="verDRE()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir</button></div><div id="dre" class="preview">...</div>';verDRE();}
async function verDRE(){const r=await GET('/api/dre_resumo');const f=await GET('/api/faturamento_resumo');document.getElementById('dre').innerHTML='Receita '+fmt(r.receita)+'<br>Impostos '+fmt(r.impostos)+'<br>Lucro '+fmt(r.lucro)+'<br>Faturamento '+fmt(f.total)+'<br>Regra: Simples PIS 0.65 COF 3 ICMS 3.4 ISS 2';document.getElementById('printCont').innerHTML='<h2>DRE</h2>'+document.getElementById('dre').innerHTML;}
async function telaAgenda(){document.getElementById('tela').innerHTML='<h3>Agenda</h3>Titulo<input id="et">Inicio<input id="ei" type="datetime-local">Fim<input id="ef" type="datetime-local"><button class="btn" onclick="saveEv()">Salvar</button><div id="la"></div>';const r=await GET('/api/agenda_lista');document.getElementById('la').innerHTML=tabela(['Titulo','Inicio','Fim'],(r.eventos||[]).map(x=>[x.titulo,x.inicio,x.fim||'']));}
async function saveEv(){await POST('/api/agenda/criar',{titulo:document.getElementById('et').value,inicio:document.getElementById('ei').value,fim:document.getElementById('ef').value});telaAgenda();}
async function telaArq(){document.getElementById('tela').innerHTML='<h3>Arquivos - upload</h3><input id="af" type="file"><button class="btn" onclick="saveAr()">Fazer Upload</button><div id="l"></div>';const r=await GET('/api/arquivos_lista');document.getElementById('l').innerHTML=tabela(['Nome','Categoria'],(r.arquivos||[]).map(a=>['<a href="'+a.url+'" target="_blank">'+a.nome+'</a>',a.categoria||'']));}
async function saveAr(){const f=document.getElementById('af').files[0];if(!f){alert('escolhe arquivo');return;}const fd=new FormData();fd.append('file',f);fd.append('categoria','GERAL');fd.append('referencia','');await fetch(B+'/api/arquivos/upload',{method:'POST',body:fd});telaArq();}
async function telaPonto(){document.getElementById('tela').innerHTML='<h3>Ponto - Registro + Ajuste + Atestado</h3><div id="lp"></div><div class="preview">Mat<input id="pm" size="8"> Data<input id="pd" type="date"> Ent<input id="pe" type="time" value="08:00"> Sai<input id="ps" type="time" value="17:00"><button class="btn" onclick="savePt()">Registrar</button></div><div class="preview">Ajuste Mat<input id="jm" size="8"> Campo<select id="jc"><option>entrada</option><option>saida</option><option>horas_trabalhadas</option><option>horas_extras</option></select> Novo<input id="jn" size="6"> Motivo<input id="jmo" size="10"><button class="btn" onclick="saveAjust()">Pedir Ajuste</button></div><div class="preview">Atestado Mat<input id="am" size="6"> Data<input id="ad" type="date"> Dias<input id="adi" size="3" value="1"><button class="btn" onclick="saveAt()">Salvar Atestado</button></div>';const r=await GET('/api/rh/ponto_calc');document.getElementById('lp').innerHTML='<b>Pontos</b>'+tabela(['Data','Mat','Ent','Sai'],(r.ponto||[]).slice(0,10).map(x=>[x.data,x.funcionario_matricula,x.entrada,x.saida]))+'<b>Ajustes</b>'+tabela(['Mat','Campo','Novo'],(r.ajustes||[]).map(x=>[x.funcionario_matricula,x.campo,x.valor_novo]))+'<b>Atestados</b>'+tabela(['Mat','Data','Dias'],(r.atestados||[]).map(x=>[x.funcionario_matricula,x.data,x.dias]))+'<b>Funcionarios</b>'+tabela(['Mat','Nome'],(r.funcionarios||[]).map(x=>[x.matricula,x.nome]));}
async function savePt(){await POST('/api/rh/ponto/registrar2',{funcionario_matricula:document.getElementById('pm').value,data:document.getElementById('pd').value,entrada:document.getElementById('pe').value,saida:document.getElementById('ps').value});telaPonto();}
async function saveAjust(){await POST('/api/rh/ponto/ajustar',{funcionario_matricula:document.getElementById('jm').value,campo:document.getElementById('jc').value,valor_novo:document.getElementById('jn').value,motivo:document.getElementById('jmo').value});alert('ajuste pedido');telaPonto();}
async function saveAt(){await POST('/api/rh/atestados/criar',{funcionario_matricula:document.getElementById('am').value,data:document.getElementById('ad').value,dias:document.getElementById('adi').value});telaPonto();}
async function telaBot(){document.getElementById('tela').innerHTML='<h3>Bot Celular - por ultimo</h3><div class="preview">Espaço chave Evolution / WhatsApp. Não mexer agora.</div><input id="bmsg" placeholder="oi"><button class="btn" onclick="testBot()">Testar</button><div id="bchat" class="preview"></div>';}
async function testBot(){const r=await POST('/api/bot/responder',{mensagem:document.getElementById('bmsg').value});document.getElementById('bchat').innerHTML=r.resposta||JSON.stringify(r);}
async function telaInteg(){document.getElementById('tela').innerHTML='<h3>Integrações TRIO API</h3><div class="noprint">Tipo<select id="it"><option>BANCO</option><option>IFOOD</option><option>NF</option><option>BOLETO</option><option>BOT</option></select>Prov<input id="ip" placeholder="PLUGGY,IFOOD,FOCUS,ASAAS">Key<input id="ik" size="20"><button class="btn" onclick="saveIn()">Salvar Chave</button></div><div id="c"></div>';const r=await GET('/api/bancos/config');document.getElementById('c').innerHTML=tabela(['Tipo','Provedor','Ativo'],(r.configs||[]).map(x=>[x.tipo,x.provedor,x.ativo?'SIM - CONECTADO':'NÃO - MANUAL']));}
async function saveIn(){await POST('/api/bancos/config',{tipo:document.getElementById('it').value,provedor:document.getElementById('ip').value,api_key:document.getElementById('ik').value});telaInteg();}
async function telaComparar(){document.getElementById('tela').innerHTML='<h3>Comparar Loja x iFood x Site</h3><div id="cmp">carregando...</div>';const v=await GET('/api/vendas');const s=await GET('/api/site/pedidos');let loja=(v.vendas||[]).reduce((a,x)=>a+parseFloat(x.total||0),0);let si=0,ifo=0;(s.pedidos||[]).forEach(p=>{if((p.forma_pagamento||'')=='IFOOD')ifo+=parseFloat(p.total||0);else si+=parseFloat(p.total||0);});document.getElementById('cmp').innerHTML=tabela(['Canal','Total','Ação'],[['Loja PDV',fmt(loja),'<button class="btn" onclick="location.href=\'/admin\'">Abrir</button>'],['iFood',fmt(ifo),'<button class="btn" onclick="aba(\'bancos\')">Administrar</button>'],['Site',fmt(si),'<button class="btn" onclick="window.open(\'/\',\'_blank\')">Ver Site</button>']]);}
async function telaAudit(){document.getElementById('tela').innerHTML='<h3>Auditoria Caixa / Estoque / Estornos / Encomendas</h3><div class="noprint"><button class="btn" onclick="telaAudit()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir</button></div><div id="a" class="preview">...</div>';const r=await GET('/api/auditoria_resumo');const v=r.vendas||[];const est=v.filter(x=>['ESTORNADA','CANCELADA'].includes((x.status||'').toUpperCase()));document.getElementById('a').innerHTML='Vendas:'+v.length+' Estornos:'+est.length+' Produtos:'+(r.produtos||[]).length+'<br>'+tabela(['ID','Total','Status'],v.slice(0,15).map(x=>[x.id,fmt(x.total),x.status||'CONFIRMADA']));document.getElementById('printCont').innerHTML='<h2>Auditoria</h2>'+document.getElementById('a').innerHTML;}
async function telaFat(){document.getElementById('tela').innerHTML='<h3>Faturamento - agrupa pendência e fatura</h3><div class="noprint"><button class="btn" onclick="verFatPrev()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir</button></div><div id="ff" class="preview">...</div><div id="fmsg"></div>';verFatPrev();}
async function verFatPrev(){const c=await GET('/api/contas');const f=await GET('/api/faturamento_resumo');let g={};(c.contas||[]).forEach(x=>{if(x.status!='ABERTO')return;let k=x.pessoa+'|'+x.tipo;if(!g[k])g[k]={pessoa:x.pessoa,tipo:x.tipo,total:0};g[k].total+=parseFloat(x.valor||0);});let h='Comp Total '+fmt(f.total||0)+'<br>'+tabela(['Cliente','Tipo','Total',''],Object.values(g).map(x=>[x.pessoa,x.tipo,fmt(x.total),x.tipo=='RECEBER'?'<button class="btn" onclick="faturarGrupo(\''+String(x.pessoa).replace(/\'/g,'')+'\','+x.total+')">Faturar</button>':'a pagar']));document.getElementById('ff').innerHTML=h;document.getElementById('printCont').innerHTML='<h2>Faturamento</h2>'+h;}
async function faturarGrupo(p,t){const r=await POST('/api/boletos/gerar',{pessoa:p,valor:t,vencimento:new Date().toISOString().slice(0,10)});document.getElementById('fmsg').innerHTML='Gerado '+r.link;verFatPrev();}
async function telaCont(){document.getElementById('tela').innerHTML='<h3>Contratos - padrão jurídico</h3><div class="noprint"><label><input type="checkbox" id="t1" checked> Serviços</label><label><input type="checkbox" id="t2"> Produção</label><label><input type="checkbox" id="t3"> CompraVenda</label><label><input type="checkbox" id="t4"> Armazenagem</label><label><input type="checkbox" id="t5"> Locação</label><br>Cliente<input id="cc">CPF<input id="cdoc" size="10">Valor<input id="cv" type="number" size="6">Prazo<input id="cp" type="date">Detalhe<input id="co" size="25"> <button class="btn" onclick="saveC()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir Contrato</button></div><div id="pct" class="preview">Preview aparece aqui...</div><div id="lc"></div>';const r=await GET('/api/contratos_lista');document.getElementById('lc').innerHTML=tabela(['ID','Cliente','Valor'],(r.contratos||[]).map(x=>[x.id,x.cliente,fmt(x.valor)]));}
async function saveC(){let t=[];if(document.getElementById('t1').checked)t.push('PRESTACAO_SERVICOS');if(document.getElementById('t2').checked)t.push('PRODUCAO_FORNECIMENTO');if(document.getElementById('t3').checked)t.push('COMPRA_VENDA');if(document.getElementById('t4').checked)t.push('ARMAZENAGEM');if(document.getElementById('t5').checked)t.push('LOCACAO_ESPACO');if(!t.length){alert('marca 1');return;}document.getElementById('pct').innerHTML='Montando...';const r=await POST('/api/contratos/criar',{cliente:document.getElementById('cc').value,cpf_cnpj:document.getElementById('cdoc').value,valor:document.getElementById('cv').value,prazo:document.getElementById('cp').value,objeto:document.getElementById('co').value,foro:'Foro local',tipos:t});document.getElementById('pct').innerHTML=(r.id?'CONTRATO '+r.id+'<br><br>':'')+(r.texto||JSON.stringify(r));document.getElementById('printCont').innerHTML='<h2>CONTRATO</h2><p>'+(r.texto||'').replace(/\n/g,'<br>')+'</p><br>Ass:___________ Data:'+new Date().toLocaleDateString('pt-BR');const r2=await GET('/api/contratos_lista');document.getElementById('lc').innerHTML=tabela(['ID','Cliente'],(r2.contratos||[]).map(x=>[x.id,x.cliente]));}
async function telaRel(){document.getElementById('tela').innerHTML='<h3>Relatórios Gerenciais</h3><div class="noprint">Tipo <select id="rtipo"><option value="vendas">Vendas / Caixa</option><option value="financeiro">Financeiro</option><option value="estoque">Produtos / Estoque</option><option value="ponto">Ponto / RH</option><option value="fiscal">Fiscal NF / DRE</option><option value="contratos">Contratos</option><option value="agenda">Agenda</option></select> Período <select id="rper"><option value="todos">Todos</option><option value="hoje">Hoje</option><option value="7d">Últimos 7 dias</option><option value="30d">Últimos 30 dias</option><option value="mes">Este mês</option></select> <button class="btn" onclick="verRel()">Ver Preview</button> <button class="btn" onclick="window.print()">Imprimir / PDF</button></div><div id="rprev" class="preview">Escolhe tipo + período...</div>';}
async function verRel(){let t=document.getElementById('rtipo').value;let per=document.getElementById('rper').value;document.getElementById('rprev').innerHTML='carregando...';let h='';if(t=='vendas'){const v=await GET('/api/vendas');let l=filtra(v.vendas||[],per);let tot=l.reduce((a,x)=>a+parseFloat(x.total||0),0);h='<b>REGRA:</b> Só com caixa aberto. Estorno exige ADM.<br>Total '+fmt(tot)+' Qtd '+l.length+'<br>'+tabela(['ID','Cliente','Total','Status'],l.slice(0,30).map(x=>[x.id,x.cliente_nome||'',fmt(x.total),x.status||'']));}if(t=='financeiro'){const c=await GET('/api/contas');let l=filtra(c.contas||[],per);h=tabela(['Pessoa','Tipo','Valor','Status'],l.slice(0,30).map(x=>[x.pessoa,x.tipo,fmt(x.valor),x.status]));}if(t=='estoque'){const p=await GET('/api/produtos');let l=filtra(p.produtos||[],per);h='<b>REGRA:</b> Mínimo 20 pães / 10 bolos.<br>'+tabela(['Nome','Preço','Status'],l.slice(0,30).map(x=>[x.nome,fmt(x.preco_venda),x.status]));}if(t=='ponto'){const r=await GET('/api/rh/ponto_calc');h='Pontos '+(r.ponto||[]).length+' Ajustes '+(r.ajustes||[]).length+' Atestados '+(r.atestados||[]).length+'<br>'+tabela(['Data','Mat'],filtrA(r.ponto||[],per).slice(0,20).map(x=>[x.data,x.funcionario_matricula]));}if(t=='fiscal'){const n=await GET('/api/nf_lista');const d=await GET('/api/dre_resumo');h='Lucro '+fmt(d.lucro)+'<br>'+tabela(['Tipo','Num','Total'],filtrA(n.notas||[],per).slice(0,20).map(x=>[x.tipo,x.numero,fmt(x.total)]));}if(t=='contratos'){const c=await GET('/api/contratos_lista');h=tabela(['ID','Cliente','Valor'],filtrA(c.contratos||[],per).map(x=>[x.id,x.cliente,fmt(x.valor)]));}if(t=='agenda'){const a=await GET('/api/agenda_lista');h=tabela(['Titulo','Inicio'],filtrA(a.eventos||[],per).map(x=>[x.titulo,x.inicio]));}document.getElementById('rprev').innerHTML=h;document.getElementById('printCont').innerHTML='<h2>REL '+t+' '+per+'</h2>'+h;}
let h=location.hash.replace('#','');if(h)aba(h);else telaBancos();
</script></body></html>
