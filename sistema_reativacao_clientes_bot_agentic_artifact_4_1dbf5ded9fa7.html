def get_stage(days_inactive: int):
    if days_inactive >= 120: return 120, "FEEDBACK_LAST_ATTEMPT"
    if days_inactive >= 90: return 90, "INCENTIVE_OFFER"
    if days_inactive >= 60: return 60, "RECOMMENDATION"
    return 30, "PROBING"

def run_reactivation_routine():
    conn = psycopg2.connect(DATABASE_URL)
    cur = conn.cursor()
    print(f"[{datetime.now()}] \uD83D\uDD39 PASSO 1 → CONSULTAR BASE")

               DATE_PART('day', NOW() - c.last_purchase_at)::int AS days_inactive,
               c.last_message_at
        FROM customers c
        WHERE c.active = TRUE
          AND c.opt_out = FALSE
          AND NOT EXISTS (
            SELECT 1 FROM financial_titles ft
            WHERE ft.customer_id = c.id AND ft.status = 'Atrasado'
          )
          AND NOT EXISTS (
            SELECT 1 FROM sales_orders so
            WHERE so.customer_id = c.id

          )
          AND (c.last_message_at IS NULL OR c.last_message_at < NOW() - INTERVAL '15 days')
          AND DATE_PART('day', NOW() - c.last_purchase_at) >= 30
        ORDER BY days_inactive DESC;
    """)

    print(f"  → {len(customers)} clientes elegíveis")

    for row in customers:
