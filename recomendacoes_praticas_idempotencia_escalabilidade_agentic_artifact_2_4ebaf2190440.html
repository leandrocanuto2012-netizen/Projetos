from sqlalchemy import select
from sqlalchemy.ext.asyncio import AsyncSession
from sqlalchemy.exc import IntegrityError
from models import IdempotencyKey, IntegrationEvent

async def process_event_idempotent(
    db: AsyncSession, 
    event: IntegrationEvent
):
    """
    Worker idempotente: verifica event_id antes de processar.
    Padrão: SELECT FOR UPDATE + INSERT protegido.
    """
    # 1. Verifica se já processamos
    stmt = select(IdempotencyKey).where(
        IdempotencyKey.event_id == event.id
    ).with_for_update()
    
    existing = await db.execute(stmt)
    row = existing.scalar_one_or_none()
    
    if row:
        # Já processado -> retorna resultado salvo (sem duplicar)
        return row.result_json

    # 2. Processa regra de negócio (ex: cria picking WMS)
    try:
        result = await create_picking_wms(event.payload_json)
        
        # 3. Persiste marca de idempotência NA MESMA transação
        idem = IdempotencyKey(
            event_id=event.id,
            aggregate_type=event.aggregate_type,
            aggregate_id=event.aggregate_id,
            result_json=result
        )
        db.add(idem)
        await db.commit()
        return result
        
    except IntegrityError:
        # Concorrência: outro worker inseriu primeiro
        await db.rollback()
        stmt = select(IdempotencyKey).where(
            IdempotencyKey.event_id == event.id
        )
        existing = await db.execute(stmt)
        return existing.scalar_one().result_json

-- WMS já tem quantity_on_hand, ERP valoriza só no encerramento NF-e

-- Tabela de saldos financeiros
CREATE TABLE stock_balances (
  product_id UUID PRIMARY KEY,
  quantity_fisico NUMERIC NOT NULL DEFAULT 0, -- espelha WMS
  quantity_financeiro NUMERIC NOT NULL DEFAULT 0,
  cost_price NUMERIC(12,4) NOT NULL, -- PMP
  total_value NUMERIC(14,2) GENERATED ALWAYS AS (quantity_financeiro * cost_price) STORED
);

-- Cálculo PMP no encerramento da NF-e de entrada
-- novo_pmp = (estoque_ant * pmp_ant + qtd_recebida * custo_nf) / (estoque_ant + qtd_recebida)

WITH entrada AS (
  SELECT 
    'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::uuid AS product_id,
    50::numeric AS qtd_recebida,
    4.80::numeric AS custo_unitario_nf -- já com frete+ICMS proporcional
),
calc AS (
  SELECT
    b.product_id,
    b.cost_price AS pmp_anterior,
    b.quantity_financeiro AS estoque_anterior,
    e.qtd_recebida,
    e.custo_unitario_nf,
    ((b.quantity_financeiro * b.cost_price) + (e.qtd_recebida * e.custo_unitario_nf))
    / NULLIF(b.quantity_financeiro + e.qtd_recebida, 0) AS novo_pmp
  FROM stock_balances b
  JOIN entrada e ON e.product_id = b.product_id
)
UPDATE stock_balances b
SET 
  quantity_financeiro = b.quantity_financeiro + c.qtd_recebida,
  cost_price = c.novo_pmp,
  updated_at = NOW()
FROM calc c
WHERE b.product_id = c.product_id
RETURNING b.product_id, c.pmp_anterior, c.novo_pmp, b.quantity_financeiro;

-- FIFO para CMV (baixa por lote mais antigo)
CREATE TABLE stock_lots (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  product_id UUID NOT NULL,
  quantity NUMERIC NOT NULL,
  unit_cost NUMERIC(12,4) NOT NULL,
  received_at TIMESTAMPTZ DEFAULT NOW()
);
CREATE INDEX ON stock_lots (product_id, received_at);

-- Baixa FIFO
WITH baixa AS (
  SELECT id, quantity, unit_cost,
         SUM(quantity) OVER (ORDER BY received_at) AS acumulado
  FROM stock_lots WHERE product_id = $1 AND quantity > 0
)
SELECT * FROM baixa WHERE acumulado <= $2; -- qtd vendida

            pmp_ant = row["cost_price"]

            INSERT INTO stock_lots (product_id, quantity, unit_cost)
            VALUES (:prod, :qtd, :custo)
        """, {"prod": payload["product_id"], "qtd": qtd, "custo": custo_nf})

# Outbox: produto + evento na mesma transação (atomicidade garantida)
@app.post("/products")
async def create_product(payload: dict, db: AsyncSession = Depends(get_db)):
    product_id = uuid.uuid4()
    event_id = uuid.uuid4()

    async with db.begin(): # transação única
        # 1. Cria produto
        await db.execute(
            "INSERT INTO products (id, sku, name, attributes) VALUES (:id,:sku,:name,:attr)",
            {
                "id": product_id,
                "sku": payload["sku"],
                "name": payload["name"],
                "attr": payload.get("attributes", {})
            }
        )
        # 2. Publica evento na mesma transação (outbox)
        await db.execute(
            """
            INSERT INTO integration_events 
            (id, aggregate_type, aggregate_id, event_type, payload_json, status)
            VALUES (:eid, 'product', :pid, 'erp.product.created', :payload, 'PENDING')
            """,
            {
                "eid": event_id,
                "pid": product_id,
                "payload": {"product_id": str(product_id), **payload}
            }
        )
    # Commit garantido: ou os dois ou nenhum -> nunca perde evento
    return {"id": str(product_id), "event_id": str(event_id)}

async def wms_worker_loop(db: AsyncSession):

        result = await db.execute("""
            SELECT * FROM integration_events
            WHERE status='PENDING'
            ORDER BY created_at ASC
            LIMIT 10
            FOR UPDATE SKIP LOCKED

        if not events:

                await db.execute("""

                    SET status='FAILED', 
                        payload_json = jsonb_set(payload_json, '{last_error}', :err::jsonb)
                    WHERE id=:id
                """, {"id": ev["id"], "err": f'"{str(e)}"'})
                await db.commit()
